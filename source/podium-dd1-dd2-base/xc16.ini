[binaries]
c = 'xc16-gcc'
ar = 'xc16-ar'
strip = 'xc16-strip'
exe_wrapper = ['python', '@DIRNAME@/tools/run_sim30_test.py']

[host_machine]
system = 'baremetal'
cpu_family = 'dspic'
cpu = '33EP512MU810'
endian = 'little'

[built-in options]
c_std = 'c99'
c_args = ['-g']
debug = true
optimization = 's'
warning_level = '0'
werror = false
