[binaries]
c = 'arm-none-eabi-gcc'
objcopy = 'arm-none-eabi-objcopy'
strip = 'arm-none-eabi-strip'

[host_machine]
system = 'baremetal'
cpu_family = 'arm'
cpu = 'cortex-m0plus'
endian = 'little'

[built-in options]
c_args = ['-mcpu=cortex-m0plus', '-mthumb']
c_link_args = ['-mcpu=cortex-m0plus', '-mthumb']

[properties]
motor_product = 'dd2'
