[dependency-groups]
build = [
    "meson",
    "ninja",
]
quality = [
    "clang-tidy",
    "pre-commit",
    "ruff",
]

[tool.uv]
default-groups = [
    "build",
    "quality"
]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]
